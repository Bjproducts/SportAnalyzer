[build]
  base = "frontend"
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicitly attach the Next.js runtime. Netlify did not auto-install the
# adapter for the existing monorepo site and otherwise published the raw
# `.next` directory without a server function, leaving every route as a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
