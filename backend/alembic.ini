# Alembic configuration.
#
# NOTE: `sqlalchemy.url` is deliberately left blank. The URL is resolved at
# runtime in alembic/env.py from application settings, so the database password
# never appears in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
# Replaces the deprecated `version_path_separator`; controls how Alembic splits
# multi-value path options.
path_separator = os

# Migration filenames get a UTC timestamp prefix so they sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url =


[post_write_hooks]
# Invoked as `python -m ruff` rather than `ruff`: ruff ships as a native binary
# with no console_scripts entry point, and the bare executable is only on PATH
# when the virtualenv is activated. Run migrations from the venv (or in the
# backend container) so these hooks resolve.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = python
ruff_fix.options = -m ruff check --fix --quiet REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
