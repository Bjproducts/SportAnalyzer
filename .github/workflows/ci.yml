name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "backend[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests
      - name: Mypy
        working-directory: backend
        run: python -m mypy app
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Netlify production build
        working-directory: frontend
        env:
          NETLIFY: "true"
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test/api
          NEXT_PUBLIC_SITE_URL: https://sport-analyzer.example.test
        run: npm run build:netlify
